openapi: 3.0.3
info:
  title: Employee Directory API
  version: 1.0.0
  description: API for managing departments, employees, and employee skills.
servers:
  - url: http://localhost:8086
tags:
  - name: Departments
  - name: Employees
  - name: Skills
  - name: Info
paths:
  /api/info:
    get:
      tags: [Info]
      summary: Get application name and version
      responses:
        '200':
          description: Application information
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppInfo' }
  /api/departments:
    get:
      tags: [Departments]
      summary: List departments with pagination and sorting
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sort
          in: query
          description: Spring Data sort expression, for example name,asc
          schema:
            type: array
            items: { type: string }
      responses:
        '200':
          description: Paginated department list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepartmentPage' }
    post:
      tags: [Departments]
      summary: Create a department
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepartmentRequest' }
      responses:
        '201':
          description: Department created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Department' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/departments/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Departments]
      summary: Get a department
      responses:
        '200':
          description: Department details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Department' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Departments]
      summary: Update a department
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepartmentRequest' }
      responses:
        '200':
          description: Department updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Department' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Departments]
      summary: Delete an empty department
      responses:
        '204': { description: Department deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/departments/{id}/employees:
    get:
      tags: [Departments]
      summary: List employees in a department
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Paginated employees
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeePage' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/skills:
    get:
      tags: [Skills]
      summary: List skills
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sort
          in: query
          description: Spring Data sort expression, for example name,asc
          schema: { type: array, items: { type: string } }
      responses:
        '200':
          description: Paginated skills
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillPage' }
    post:
      tags: [Skills]
      summary: Create a skill
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkillRequest' }
      responses:
        '201':
          description: Skill created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Skill' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/employees:
    get:
      tags: [Employees]
      summary: List employees, optionally filtered by department
      parameters:
        - name: departmentId
          in: query
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Paginated employees
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeePage' }
    post:
      tags: [Employees]
      summary: Create an employee
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeRequest' }
      responses:
        '201':
          description: Employee created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/employees/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Employees]
      summary: Get an employee and assigned skills
      responses:
        '200':
          description: Employee details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Employees]
      summary: Update an employee and their department or skills
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeRequest' }
      responses:
        '200':
          description: Employee updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Employees]
      summary: Delete an employee
      responses:
        '204': { description: Employee deleted }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/employees/{id}/skills/{sid}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - name: sid
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Employees]
      summary: Add a skill to an employee
      responses:
        '200':
          description: Employee with updated skills
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Employees]
      summary: Remove a skill from an employee
      responses:
        '200':
          description: Employee with updated skills
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Page:
      name: page
      in: query
      description: Zero-based page index
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      description: Page size (defaults to configured pagination.default-page-size)
      schema: { type: integer, minimum: 1, maximum: 200 }
  responses:
    BadRequest:
      description: Invalid request or validation failure
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Requested resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: Request conflicts with existing data
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    AppInfo:
      type: object
      properties:
        name: { type: string }
        version: { type: string }
    DepartmentRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, example: Engineering }
        location: { type: string, nullable: true, example: New York }
    Department:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        location: { type: string, nullable: true }
        headCount: { type: integer, nullable: true }
    DepartmentPage:
      type: object
      description: Spring Data page response for departments
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Department' }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        size: { type: integer }
        number: { type: integer }
        first: { type: boolean }
        last: { type: boolean }
        numberOfElements: { type: integer }
        empty: { type: boolean }
    SkillRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, example: Java }
        category: { type: string, nullable: true, example: Backend }
    Skill:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        category: { type: string, nullable: true }
    EmployeeRequest:
      type: object
      required: [name, email, joiningDate, departmentId]
      properties:
        name: { type: string, minLength: 1, example: Alex Morgan }
        email: { type: string, format: email, example: alex@example.com }
        designation: { type: string, nullable: true, example: Software Engineer }
        joiningDate: { type: string, format: date, example: '2024-01-15' }
        departmentId: { type: integer, format: int64 }
        skillIds:
          type: array
          maxItems: 10
          items: { type: integer, format: int64 }
    Employee:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        email: { type: string, format: email }
        designation: { type: string, nullable: true }
        joiningDate: { type: string, format: date }
        department: { $ref: '#/components/schemas/Department' }
        skills:
          type: array
          items: { $ref: '#/components/schemas/Skill' }
    EmployeePage:
      type: object
      description: Spring Data page response for employees
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Employee' }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        size: { type: integer }
        number: { type: integer }
        first: { type: boolean }
        last: { type: boolean }
        numberOfElements: { type: integer }
        empty: { type: boolean }
    SkillPage:
      type: object
      description: Spring Data page response for skills
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Skill' }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        size: { type: integer }
        number: { type: integer }
        first: { type: boolean }
        last: { type: boolean }
        numberOfElements: { type: integer }
        empty: { type: boolean }
    ApiError:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string }
        message: { type: string }
        details:
          type: object
          additionalProperties: { type: string }
